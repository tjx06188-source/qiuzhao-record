function render(){const q=document.getElementById('q').value.trim().toLowerCase(),p=document.getElementById('priority').value,s=document.getElementById('status').value,c=document.getElementById('change').value;let shown=0;grid.innerHTML='';
for(const r of rows){const a=r.analysis,raw=r.raw,status=arr(raw['最新状态'])||'状态待补充',company=raw['公司名称']||'公司待补充',role=raw['岗位名称']||'岗位待补充';const hay=JSON.stringify(r).toLowerCase();if(q&&!hay.includes(q)||p&&a.priority!==p||s&&status!==s||c&&r.change!==c)continue;shown++;const url=r.url;const places=arr(raw['地点']);const changed=r.change==='new'?'新增':r.change==='changed'?'变更':r.change==='archived'?'历史保留':'未变化';
const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="top"><div><h2>${esc(company)} · ${esc(role)}</h2><div class="sub">${esc(places)}${places?' · ':''}${esc(raw['招聘类型']?arr(raw['招聘类型']):'')}${url?` · <a href="${esc(url)}" target="_blank" rel="noreferrer">投递链接</a>`:''}</div></div><div class="tags"><span class="tag priority ${a.priority}">${a.priority}</span><span class="tag">${esc(status)}</span><span class="tag ${r.change==='new'||r.change==='changed'?'changed':''}">${changed}</span></div></div><div class="tags"><span class="tag">${esc(a.jd_status)}</span><span class="tag">${esc(a.resume_version)}</span>${a.jd_keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div><details><summary>查看岗位分析与行动建议</summary><div class="sections"><div class="box"><h3>优先级与理由</h3><b>${a.priority}</b> · ${esc(a.priority_reason)}</div><div class="box"><h3>JD 解读</h3><span class="${a.jd_status==='JD信息不足'?'warn':''}">${esc(a.jd_summary)}</span></div><div class="box"><h3>匹配证据</h3>${li(a.evidence)}</div><div class="box"><h3>主要风险</h3>${esc(a.risk)}</div><div class="box"><h3>面试深挖</h3>${li(a.interview)}</div><div class="box"><h3>扬长避短</h3>${esc(a.leverage)}</div><div class="box"><h3>推荐简历版本</h3>${esc(a.resume_version)}</div><div class="box"><h3>下一步动作</h3>${esc(a.next_action)}</div></div></details>`;grid.appendChild(card)}document.getElementById('count').textContent=`显示 ${shown} / ${rows.length} 条`;document.getElementById('empty').style.display=shown?'none':'block'}
['q','priority','status','change'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));render();
</script></body></html>
